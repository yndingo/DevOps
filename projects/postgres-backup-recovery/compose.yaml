name: postgres-backup-recovery

services:
  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      # PostgreSQL 18: mount the parent directory, not .../data.
      - pg_data:/var/lib/postgresql
      - backups:/backups
      - ./db:/db:ro
      - ./scripts:/scripts:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  backup-scheduler:
    image: postgres:18
    restart: unless-stopped

    profiles: ["scheduler"]

    depends_on:
      db:
        condition: service_healthy

    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

    volumes:
      - backups:/backups
      - ./scripts:/scripts:ro

    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]

volumes:
  pg_data:
  backups:
